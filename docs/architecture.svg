<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">EpixBox application architecture</title>
  <desc id="description">A landscape architecture diagram showing photographers and clients using a React frontend hosted on Vercel, an Express API on Render, Neon PostgreSQL, private AWS S3 media storage, CloudFront image delivery, and payment, email, and optional monitoring integrations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3974c6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d1932f"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
      .title { font-size: 21px; font-weight: 700; fill: #172b4d; }
      .detail { font-size: 14px; fill: #53657d; }
      .edge-label { font-size: 12px; font-weight: 600; fill: #52647b; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#f4f7fb"/>
  <path d="M0 18Q0 0 18 0H1182Q1200 0 1200 18V94H0Z" fill="#142b4a"/>
  <text x="48" y="43" fill="#9ec7ff" font-size="12" font-weight="700" letter-spacing="2">EPIXBOX  /  SYSTEM DESIGN</text>
  <text x="48" y="73" fill="#ffffff" font-size="24" font-weight="700">Production application architecture</text>
  <text x="1150" y="58" text-anchor="end" fill="#c7d5e8" font-size="13">Web · API · data · media</text>

  <rect x="32" y="112" width="1136" height="354" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
  <text x="56" y="143" class="eyebrow" fill="#64748b">REQUEST &amp; MEDIA FLOW</text>
  <text x="1144" y="143" text-anchor="end" font-size="12" fill="#75849a">Configured hosted services</text>

  <rect x="56" y="191" width="164" height="138" rx="11" fill="#f5f8fd" stroke="#cbd8e8" stroke-width="1.5"/>
  <rect x="56" y="191" width="164" height="5" rx="2.5" fill="#64748b"/>
  <text x="74" y="220" class="eyebrow" fill="#64748b">AUDIENCE</text>
  <text x="74" y="252" class="title">Photographer</text>
  <text x="74" y="278" class="detail">and client browser</text>
  <text x="74" y="307" font-size="12" fill="#7b899d">Portfolio · galleries · proofing</text>

  <rect x="280" y="191" width="190" height="138" rx="11" fill="#eff6ff" stroke="#b6d0f2" stroke-width="1.5"/>
  <rect x="280" y="191" width="190" height="5" rx="2.5" fill="#3974c6"/>
  <text x="299" y="220" class="eyebrow" fill="#3974c6">WEB EXPERIENCE</text>
  <text x="299" y="252" class="title">Vercel</text>
  <text x="299" y="278" class="detail">React 19 · Vite</text>
  <text x="299" y="307" font-size="12" fill="#617792">Frontend hosting</text>

  <rect x="530" y="191" width="226" height="138" rx="11" fill="#eef8f2" stroke="#b8dfc7" stroke-width="1.5"/>
  <rect x="530" y="191" width="226" height="5" rx="2.5" fill="#27835a"/>
  <text x="550" y="220" class="eyebrow" fill="#27835a">APPLICATION SERVICES</text>
  <text x="550" y="252" class="title">Render API</text>
  <text x="550" y="278" class="detail">Node.js · Express</text>
  <text x="550" y="307" font-size="12" fill="#617792">REST · authentication · business logic</text>

  <rect x="812" y="169" width="332" height="276" rx="12" fill="#fbfcfe" stroke="#d8e1ed" stroke-width="1.5"/>
  <text x="832" y="194" class="eyebrow" fill="#64748b">PERSISTENCE &amp; MEDIA</text>

  <rect x="832" y="211" width="292" height="87" rx="9" fill="#fff8ea" stroke="#ead7ad" stroke-width="1.3"/>
  <circle cx="859" cy="254" r="16" fill="#f2c46d"/>
  <path d="M851 251h16M851 257h16" stroke="#654b1f" stroke-width="2" stroke-linecap="round"/>
  <text x="886" y="245" font-size="17" font-weight="700" fill="#433515">Neon PostgreSQL</text>
  <text x="886" y="269" class="detail">Accounts · galleries · orders</text>

  <rect x="832" y="316" width="174" height="106" rx="9" fill="#fff8ea" stroke="#ead7ad" stroke-width="1.3"/>
  <circle cx="859" cy="351" r="16" fill="#f2c46d"/>
  <path d="M851 348h16v11h-16zM855 344h8v4" fill="none" stroke="#654b1f" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="882" y="351" font-size="16" font-weight="700" fill="#433515">AWS S3</text>
  <text x="850" y="383" class="detail">Private photo objects</text>
  <text x="850" y="403" font-size="12" fill="#7b899d">Signed access</text>

  <rect x="1020" y="316" width="104" height="106" rx="9" fill="#fff8ea" stroke="#ead7ad" stroke-width="1.3"/>
  <circle cx="1072" cy="350" r="15" fill="#f2c46d"/>
  <path d="M1062 350h20M1072 340v20" stroke="#654b1f" stroke-width="1.6" stroke-linecap="round"/>
  <text x="1072" y="383" text-anchor="middle" font-size="15" font-weight="700" fill="#433515">CloudFront</text>
  <text x="1072" y="403" text-anchor="middle" font-size="11" fill="#7b899d">Image CDN</text>

  <path d="M220 260H272" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="224" y="237" width="45" height="19" rx="9.5" fill="#ffffff"/>
  <text x="246" y="251" text-anchor="middle" class="edge-label">HTTPS</text>

  <path d="M470 260H522" fill="none" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="477" y="237" width="40" height="19" rx="9.5" fill="#ffffff"/>
  <text x="497" y="251" text-anchor="middle" class="edge-label">/api/*</text>

  <path d="M756 239H824" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="761" y="216" width="58" height="19" rx="9.5" fill="#ffffff"/>
  <text x="790" y="230" text-anchor="middle" class="edge-label">Sequelize</text>

  <path d="M756 281H790V369H824" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="763" y="321" width="57" height="19" rx="9.5" fill="#ffffff"/>
  <text x="791" y="335" text-anchor="middle" class="edge-label">Media I/O</text>

  <path d="M1006 369H1012" fill="none" stroke="#d1932f" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M1072 422V444H138V337" fill="none" stroke="#d1932f" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="520" y="431" width="170" height="20" rx="10" fill="#ffffff"/>
  <text x="605" y="445" text-anchor="middle" class="edge-label">CloudFront image delivery</text>

  <rect x="32" y="489" width="1136" height="185" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
  <text x="56" y="520" class="eyebrow" fill="#64748b">CONNECTED SERVICES</text>
  <text x="1144" y="520" text-anchor="end" font-size="12" fill="#75849a">API and client integrations · enabled by configuration</text>

  <rect x="56" y="540" width="330" height="104" rx="10" fill="#f7f4fc" stroke="#d8cbed" stroke-width="1.3"/>
  <rect x="56" y="540" width="5" height="104" rx="2.5" fill="#7954b5"/>
  <text x="77" y="570" class="eyebrow" fill="#7954b5">PAYMENTS</text>
  <text x="77" y="601" font-size="19" font-weight="700" fill="#302248">Razorpay · PayPal</text>
  <text x="77" y="624" class="detail">API checkout and webhooks</text>

  <rect x="435" y="540" width="330" height="104" rx="10" fill="#f7f4fc" stroke="#d8cbed" stroke-width="1.3"/>
  <rect x="435" y="540" width="5" height="104" rx="2.5" fill="#7954b5"/>
  <text x="456" y="570" class="eyebrow" fill="#7954b5">MESSAGING</text>
  <text x="456" y="601" font-size="19" font-weight="700" fill="#302248">SMTP email</text>
  <text x="456" y="624" class="detail">Transactional notifications</text>

  <rect x="814" y="540" width="330" height="104" rx="10" fill="#f7f4fc" stroke="#d8cbed" stroke-width="1.3"/>
  <rect x="814" y="540" width="5" height="104" rx="2.5" fill="#7954b5"/>
  <text x="835" y="570" class="eyebrow" fill="#7954b5">OBSERVABILITY</text>
  <text x="835" y="601" font-size="19" font-weight="700" fill="#302248">Sentry · LogRocket</text>
  <text x="835" y="624" class="detail">Sentry: client + API · LogRocket: client</text>

  <text x="600" y="699" text-anchor="middle" font-size="12" fill="#718198">Production topology · local Docker, Kubernetes and Terraform workflows are documented separately</text>
</svg>
