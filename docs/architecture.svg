<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title description">
  <title id="title">EpixBox configured system architecture</title>
  <desc id="description">Configured system architecture showing the browser and Vercel React application, the Vercel API rewrite to a Render Express service with security middleware and domain route groups, Sequelize and Neon PostgreSQL, private S3 photo storage and CloudFront delivery, payment and email providers, optional Sentry and LogRocket, and a separate GitHub Actions validation pipeline. Local Docker, Kubernetes, and Terraform workflows are identified separately. This diagram does not claim high availability or a private network topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#62748b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3974c6"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#27835a"/>
    </marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c78417"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.1px; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .edge { font-size: 13px; font-weight: 600; fill: #53657d; }
    </style>
  </defs>

