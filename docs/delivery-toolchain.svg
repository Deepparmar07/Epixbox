<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title description">
  <title id="title">EpixBox CI/CD and engineering toolchain</title>
  <desc id="description">A separate delivery architecture showing GitHub pull requests and main pushes triggering GitHub Actions builds and validation, hosting-provider integrations deploying the frontend to Vercel and API to Render, plus local Docker Compose and Docker Desktop Kubernetes workflows and an unapplied Terraform AWS foundation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3974c6"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#27835a"/>
    </marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7954b5"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.1px; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .edge { font-size: 13px; font-weight: 600; fill: #53657d; }
    </style>
  </defs>

  <rect width="1440" height="790" rx="18" fill="#f3f6fa"/>
  <path d="M0 18Q0 0 18 0H1422Q1440 0 1440 18V100H0Z" fill="#142b4a"/>
  <text x="48" y="39" fill="#9ec7ff" class="eyebrow">EPIXBOX  /  DELIVERY ENGINEERING</text>
  <text x="48" y="72" fill="#ffffff" font-size="25" font-weight="700">CI/CD &amp; infrastructure toolchain</text>
  <text x="1392" y="58" text-anchor="end" fill="#c7d5e8" font-size="13">Automation boundaries are explicit</text>

  <rect x="32" y="120" width="1376" height="308" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
  <text x="56" y="152" class="eyebrow" fill="#64748b">01  /  SOURCE, CONTINUOUS INTEGRATION &amp; DEPLOYMENT</text>

  <rect x="58" y="210" width="230" height="126" rx="10" fill="#f5f8fd" stroke="#cbd8e8" stroke-width="1.5"/>
  <rect x="58" y="210" width="230" height="5" rx="2.5" fill="#64748b"/>
  <text x="78" y="241" class="eyebrow" fill="#64748b">SOURCE CONTROL</text>
  <text x="78" y="274" class="heading" fill="#172b4d">GitHub</text>
  <text x="78" y="300" class="body" fill="#53657d">Pull requests · main</text>
  <text x="78" y="321" class="small" fill="#75849a">Review and version control</text>

  <rect x="351" y="177" width="454" height="219" rx="11" fill="#eff6ff" stroke="#b6d0f2" stroke-width="1.5"/>
  <rect x="351" y="177" width="454" height="5" rx="2.5" fill="#3974c6"/>
  <text x="375" y="209" class="eyebrow" fill="#3974c6">CI  /  GITHUB ACTIONS</text>
  <text x="375" y="239" class="heading" fill="#172b4d">Build &amp; validate</text>
  <rect x="375" y="257" width="190" height="48" rx="7" fill="#ffffff" stroke="#d4e2f2"/>
  <text x="389" y="278" class="body" font-weight="700" fill="#35465c">Client build</text>
  <text x="389" y="296" class="small" fill="#75849a">npm ci · Vite</text>
  <rect x="580" y="257" width="201" height="48" rx="7" fill="#ffffff" stroke="#d4e2f2"/>
  <text x="594" y="278" class="body" font-weight="700" fill="#35465c">Container builds</text>
  <text x="594" y="296" class="small" fill="#75849a">API + client images</text>
  <rect x="375" y="320" width="190" height="48" rx="7" fill="#ffffff" stroke="#d4e2f2"/>
  <text x="389" y="341" class="body" font-weight="700" fill="#35465c">Kubernetes checks</text>
  <text x="389" y="359" class="small" fill="#75849a">Selected manifests</text>
  <rect x="580" y="320" width="201" height="48" rx="7" fill="#ffffff" stroke="#d4e2f2"/>
  <text x="594" y="341" class="body" font-weight="700" fill="#35465c">Terraform checks</text>
  <text x="594" y="359" class="small" fill="#75849a">fmt · init · validate</text>

  <rect x="876" y="197" width="230" height="74" rx="10" fill="#eef8f2" stroke="#b8dfc7" stroke-width="1.5"/>
  <rect x="876" y="197" width="5" height="74" rx="2.5" fill="#27835a"/>
  <text x="897" y="225" class="eyebrow" fill="#27835a">CD  /  FRONTEND</text>
  <text x="897" y="251" class="heading" fill="#172b4d">Vercel</text>
  <text x="1078" y="251" text-anchor="end" class="small" fill="#617792">React app</text>

  <rect x="876" y="303" width="230" height="74" rx="10" fill="#eef8f2" stroke="#b8dfc7" stroke-width="1.5"/>
  <rect x="876" y="303" width="5" height="74" rx="2.5" fill="#27835a"/>
  <text x="897" y="331" class="eyebrow" fill="#27835a">CD  /  API</text>
  <text x="897" y="357" class="heading" fill="#172b4d">Render</text>
  <text x="1078" y="357" text-anchor="end" class="small" fill="#617792">Express API</text>

  <rect x="1150" y="225" width="232" height="124" rx="10" fill="#f8fbf9" stroke="#b8dfc7" stroke-width="1.5"/>
  <text x="1170" y="254" class="eyebrow" fill="#27835a">CD OWNERSHIP</text>
  <text x="1170" y="284" font-size="18" font-weight="700" fill="#172b4d">Hosting providers</text>
  <text x="1170" y="310" class="body" fill="#53657d">Deploy from main</text>
  <text x="1170" y="334" class="small" fill="#75849a">Independent of Actions CI</text>

  <path d="M288 252H343" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="238" text-anchor="middle" class="edge">PR / push</text>
  <path d="M288 318H312V407H1266V357" fill="none" stroke="#27835a" stroke-width="2" marker-end="url(#green-arrow)"/>
  <rect x="753" y="396" width="194" height="20" rx="10" fill="#ffffff"/>
  <text x="850" y="410" text-anchor="middle" class="edge">main push · hosting CD</text>
  <path d="M1150 257H1124V234H1114" fill="none" stroke="#27835a" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M1150 317H1124V340H1114" fill="none" stroke="#27835a" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="32" y="453" width="1376" height="273" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
  <text x="56" y="485" class="eyebrow" fill="#64748b">02  /  CONTAINER, ORCHESTRATION &amp; INFRASTRUCTURE TOOLING</text>
  <text x="1384" y="485" text-anchor="end" class="small" fill="#75849a">Engineering / validation workflows · not the current hosted runtime</text>

  <rect x="58" y="521" width="401" height="166" rx="11" fill="#f5f8fd" stroke="#cbd8e8" stroke-width="1.5"/>
  <rect x="58" y="521" width="401" height="5" rx="2.5" fill="#64748b"/>
  <text x="80" y="553" class="eyebrow" fill="#64748b">CONTAINERIZATION</text>
  <text x="80" y="584" class="heading" fill="#172b4d">Docker</text>
  <text x="80" y="611" class="body" fill="#53657d">Dockerfiles build separate API and client images.</text>
  <text x="80" y="636" class="body" fill="#53657d">Docker Compose runs the app locally.</text>
  <text x="80" y="664" class="small" fill="#75849a">Compose uses an externally configured PostgreSQL DB.</text>

  <rect x="519" y="521" width="401" height="166" rx="11" fill="#eff6ff" stroke="#b6d0f2" stroke-width="1.5"/>
  <rect x="519" y="521" width="401" height="5" rx="2.5" fill="#3974c6"/>
  <text x="541" y="553" class="eyebrow" fill="#3974c6">ORCHESTRATION</text>
  <text x="541" y="584" class="heading" fill="#172b4d">Kubernetes</text>
  <text x="541" y="611" class="body" fill="#53657d">Manifests define API and client workloads.</text>
  <text x="541" y="636" class="body" fill="#53657d">Local Docker Desktop validation.</text>
  <text x="541" y="664" class="small" fill="#75849a">Separate from the hosted production runtime.</text>

  <rect x="980" y="521" width="402" height="166" rx="11" fill="#fff8ea" stroke="#ead7ad" stroke-width="1.5"/>
  <rect x="980" y="521" width="402" height="5" rx="2.5" fill="#c78417"/>
  <text x="1002" y="553" class="eyebrow" fill="#9b6817">INFRASTRUCTURE AS CODE</text>
  <text x="1002" y="584" class="heading" fill="#433515">Terraform</text>
  <text x="1002" y="611" class="body" fill="#655531">Describes a possible AWS VPC, ECR, EKS and S3.</text>
  <text x="1002" y="636" class="body" fill="#655531">CI formats and validates the configuration.</text>
  <text x="1002" y="664" class="small" fill="#86744f">Not applied · not managing current production.</text>

  <path d="M257 396V438H258V513" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <path d="M576 396V438H719V513" fill="none" stroke="#3974c6" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#blue-arrow)"/>
  <path d="M680 368V438H1181V513" fill="none" stroke="#c78417" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#amber-arrow)"/>

  <text x="720" y="765" text-anchor="middle" class="small" fill="#718198">GitHub Actions builds images but does not publish them to a registry or deploy the application. Hosting providers perform configured CD independently.</text>
</svg>
